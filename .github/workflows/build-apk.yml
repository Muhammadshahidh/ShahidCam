name: Check Missing Files

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check key files
        run: |
          echo "=== gradlew ==="
          ls -la gradlew || echo "MISSING"
          echo ""
          echo "=== local.properties ==="
          ls -la local.properties || echo "MISSING"
          echo ""
          echo "=== libs.versions.toml ==="
          find . -name "libs.versions.toml" || echo "MISSING"
          echo ""
          echo "=== app/libs/aar/ ==="
          ls -la app/libs/aar/ || echo "MISSING FOLDER"
          echo ""
          echo "=== ffmpeg-kit files ==="
          find . -name "*ffmpeg*" -o -name "*.aar" 2>/dev/null || echo "NO AAR FILES"
          echo ""
          echo "=== app/libs/ ==="
          ls -la app/libs/ || echo "MISSING"
          echo ""
          echo "=== AppLockLibrary ==="
          ls -la app/libs/AppLockLibrary/ 2>/dev/null || echo "MISSING"
