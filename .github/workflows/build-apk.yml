name: Build ShahidCam APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "KEYSTORE_FILE=" >> local.properties
          echo "KEYSTORE_PASSWORD=" >> local.properties
          echo "KEY_ALIAS=" >> local.properties
          echo "KEY_PASSWORD=" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clone patched Media3
        run: |
          git clone --depth 1 https://github.com/anonfaded/media3-patched.git /tmp/media3-patched

      - name: Build Debug APK
        run: ./gradlew assembleDefaultDebug --no-daemon --stacktrace

      - name: Find and list APKs
        run: |
          echo "=== Searching for APK files ==="
          find app/build/outputs -name "*.apk" -type f
          echo ""
          echo "=== Listing all output dirs ==="
          ls -la app/build/outputs/apk/ || echo "No apk folder"

      - name: Upload all APKs
        uses: actions/upload-artifact@v4
        with:
          name: ShahidCam-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
