name: Build Google Play Release AAB

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "KEYSTORE_FILE=" >> local.properties

      - name: Grant execution permission to gradlew
        run: chmod +x gradlew

      - name: Clone patched Media3 dependency
        run: |
          git clone --depth 1 https://github.com/anonfaded/media3-patched.git /tmp/media3-patched

      - name: Build Google Play Release Bundle (AAB)
        run: ./gradlew bundleDefaultRelease --no-daemon --stacktrace

      - name: Upload Google Play Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShahidCam-GooglePlay-Release-AAB
          path: app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
